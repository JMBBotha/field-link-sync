name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04          # pinned; avoids the 19 Oct ubuntu-latest -> Ubuntu 26 switch surprise

    steps:
      - uses: actions/checkout@v5     # Node 24 runtime
      - uses: actions/setup-node@v5   # Node 24 runtime
        with:
          node-version: 22            # @capacitor/cli 8 needs Node >= 22
      - uses: oven-sh/setup-bun@v2    # Node 24 runtime

      # Lovable keeps bun.lock up to date (not package-lock.json), so install from bun.lock
      - run: bun install --frozen-lockfile

      - name: Run unit & integration tests
        run: bunx vitest run --reporter=verbose

      - name: TypeScript type check
        run: bunx tsc --noEmit
